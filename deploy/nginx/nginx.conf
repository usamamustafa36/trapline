# Trapline C2 — reverse proxy (nginx → dashboard + API)
upstream lure_api {
    server central-api:8000;
}

upstream lure_dashboard {
    server dashboard:3000;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 10M;

    # Central ingestion + query API (shipper agents POST here)
    location /api/ {
        proxy_pass         http://lure_api;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # FastAPI interactive docs
    location /docs {
        proxy_pass         http://lure_api;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
    }

    location /openapi.json {
        proxy_pass         http://lure_api/api/v1/openapi.json;
        proxy_set_header   Host              $host;
    }

    # Next.js dashboard
    location / {
        proxy_pass         http://lure_dashboard;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   Upgrade           $http_upgrade;
        proxy_set_header   Connection        "upgrade";
    }
}
